name: CI da aplicação

on:
  pull_request:
    paths:
      - "backend/**"
      - "extracao/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "extracao/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            extracao/requirements.txt
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r extracao/requirements.txt
      - name: Testar API
        working-directory: backend
        run: python -m pytest
      - name: Testar extração
        working-directory: extracao
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        working-directory: frontend
        run: npm ci
      - name: Testar cliente da API
        working-directory: frontend
        run: npm test
      - name: Analisar código
        working-directory: frontend
        run: npm run lint
      - name: Compilar frontend
        working-directory: frontend
        run: npm run build
